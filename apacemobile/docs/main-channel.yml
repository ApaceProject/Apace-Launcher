# Workflow CI dla kanału „Main" Apace Mobile
#
# Uruchom w TWOIM forku repozytorium Apace (github.com/KotPasztet/Apace).
# Buduje framework-dependent linux-arm64 (tak jak release.yml upstream) z gałęzi main,
# liczy SHA-256 i publikuje manifest {version,url,sha256} na gałęzi gh-pages.
#
# W Apace Mobile: Ustawienia → „Kanał Main — manifest CI" → wklej URL:
#   https://<twoj-user>.github.io/<fork-apace>/main-manifest.json
# (lub dowolny publiczny URL do tego pliku).
#
# Wymaga: repo sklonowane z submodułami (publish.ps1 wykonuje git submodule update).

name: build-main-manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup PowerShell
        run: |
          curl -fsSL https://github.com/PowerShell/PowerShell/releases/download/v7.6.1/powershell-7.6.1-linux-x64.tar.gz -o /tmp/pwsh.tgz
          sudo mkdir -p /opt/microsoft/powershell/7
          sudo tar zxf /tmp/pwsh.tgz -C /opt/microsoft/powershell/7
          sudo chmod +x /opt/microsoft/powershell/7/pwsh
          sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh

      - name: Build framework-dependent linux-arm64
        run: pwsh ./publish.ps1 -profiles "framework-dependent-linux-arm64"

      - name: Hard-fail if ApiServer missing (jak w Dockerfile)
        run: |
          test -f build/Release/framework-dependent-linux-arm64/components/ApiServer.dll
          test -f build/Release/framework-dependent-linux-arm64/launcher/Launcher.dll

      - name: Zip
        run: |
          cd build/Release/framework-dependent-linux-arm64
          zip -r -y "$GITHUB_WORKSPACE/Apace-linux-arm64.zip" .

      - name: Compute SHA-256
        id: sha
        run: |
          sha256sum Apace-linux-arm64.zip | awk '{print $1}' > sha256.txt
          echo "sha=$(cat sha256.txt)" >> $GITHUB_OUTPUT
          echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases (pre-release, „main")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete main-channel --yes --cleanup-tag 2>/dev/null || true
          gh release create main-channel Apace-linux-arm64.zip \
            --title "Apace main @ ${{ steps.sha.outputs.version }}" \
            --notes "Automatyczny build gałęzi main dla Apace Mobile (kanał Main)." \
            --prerelease

      - name: Build manifest JSON
        run: |
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/main-channel/Apace-linux-arm64.zip"
          cat > main-manifest.json <<EOF
          {"version":"${{ steps.sha.outputs.version }}","url":"$ASSET_URL","sha256":"${{ steps.sha.outputs.sha }}"}
          EOF
          cat main-manifest.json

      - name: Publish manifest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          destination_dir: .
